{% load static %}
{# Link menu nunjuk ke bagian-bagian di landing page #}
<header class="mx-auto flex h-[84px] w-full max-w-[1440px] items-center gap-6 px-5 md:px-10 xl:px-28">
  <a href="{% url 'core:landing' %}" class="logo-placeholder" aria-label="Wiji, ke beranda">LOGO</a>

  <nav class="hidden flex-1 items-center justify-center gap-8 lg:flex" aria-label="Navigasi publik">
    <a class="nav-link" href="{% url 'core:landing' %}#cara-kerja">Cara kerja</a>
    <a class="nav-link" href="{% url 'core:landing' %}#dua-jalur">Dua jalur</a>
    <a class="nav-link" href="{% url 'core:landing' %}#katalog">Katalog tanaman</a>
    <a class="nav-link" href="{% url 'core:landing' %}#alur">Pemeriksaan</a>
  </nav>

  <div class="ml-auto flex items-center gap-2 lg:ml-0">
    {% if user.is_authenticated %}
      <span class="hidden px-3 text-[15px] font-semibold sm:inline">{{ user.display_name }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-leaf">Keluar</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}" class="btn btn-ghost">Masuk</a>
      <a href="{% url 'accounts:register' %}" class="btn btn-leaf">Daftar gratis</a>
    {% endif %}
  </div>
</header>
