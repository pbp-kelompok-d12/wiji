{% load static %}
{# Link menu nunjuk ke bagian-bagian di landing page #}
<div class="site-header" id="site-header">
<header class="mx-auto flex h-[68px] w-full max-w-[1200px] items-center gap-6 px-5 md:px-8">
  <a href="{% url 'core:landing' %}" class="flex items-center" aria-label="Wiji, ke beranda"><img src="{% static 'img/logo-wordmark.svg' %}" alt="Wiji" class="h-8 w-auto"></a>

  <nav class="hidden flex-1 items-center justify-center gap-8 lg:flex" aria-label="Navigasi publik">
    <a class="nav-link" href="{% url 'core:landing' %}#cara-kerja">Cara kerja</a>
    <a class="nav-link" href="{% url 'core:landing' %}#langkah">Cara pakai</a>
    <a class="nav-link" href="{% url 'core:landing' %}#katalog">Katalog tanaman</a>
    <a class="nav-link" href="{% url 'core:landing' %}#alur">Pemeriksaan</a>
  </nav>

  <div class="ml-auto flex items-center gap-2 lg:ml-0">
    {% if user.is_authenticated %}
      <span class="hidden px-3 text-sm font-semibold sm:inline">{{ user.display_name }}</span>
      <a href="{% url 'dashboard:home' %}" class="btn btn-ghost">Dashboard</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-leaf">Keluar</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}" class="btn btn-ghost">Masuk</a>
      <a href="{% url 'accounts:register' %}" class="btn btn-leaf">Daftar gratis</a>
    {% endif %}
  </div>
</header>
</div>
