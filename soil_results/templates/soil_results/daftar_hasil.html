{% extends 'app_base.html' %}

{% block title %}Hasil tanah{% endblock %}

{% block app_content %}
<div class="mx-auto max-w-4xl">
  <h1 class="heading text-[28px]">Hasil tanah</h1>
  <p class="mt-2 text-sm text-ink-soft">
    Riwayat hasil pemeriksaan untuk lahan milikmu.
  </p>

  <form method="get"
      action="{% url 'soil_results:daftar_hasil' %}"
      hx-get="{% url 'soil_results:daftar_hasil' %}"
      hx-target="#daftar-hasil"
      hx-swap="innerHTML"
      class="mt-5 flex flex-wrap gap-3">
    <label for="cari-hasil" class="sr-only">Cari nama lahan</label>
    <input id="cari-hasil" type="search" name="q"
           value="{{ pencarian }}"
           placeholder="Cari nama lahan..."
           class="rounded-xl border border-line px-3 py-2">

    <label for="filter-asal" class="sr-only">Asal hasil</label>
    <select id="filter-asal" name="asal"
            class="rounded-xl border border-line px-3 py-2">
      <option value="">Semua asal</option>
      <option value="mandiri"
              {% if asal == "mandiri" %}selected{% endif %}>
        Hasil Mandiri
      </option>
      <option value="wiji"
              {% if asal == "wiji" %}selected{% endif %}>
        Hasil Wiji
      </option>
    </select>

    <button type="submit" class="btn btn-primary">Terapkan</button>
    <a href="{% url 'soil_results:daftar_hasil' %}"
       class="btn btn-ghost">Reset</a>
  </form>

  <div id="daftar-hasil"
     class="mt-5 space-y-3"
     aria-live="polite">
    {% include 'soil_results/partials/daftar_hasil_items.html' %}
  </div>
</div>
{% endblock %}
