{% extends 'app_base.html' %}

{% block title %}Hapus Rencana{% endblock %}
{% block crumb %}Hapus rencana{% endblock %}

{% block app_content %}
<div class="fixed inset-0 z-[9999] flex min-h-screen items-center justify-center bg-[#111916] p-4">

  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="hapus-rencana-title"
    class="w-full max-w-[360px] rounded-2xl bg-white p-[18px] shadow-xl"
  >
    <!-- Ikon peringatan -->
    <div class="flex h-[34px] w-[34px] items-center justify-center rounded-[10px] bg-[#F9E3DF] text-[#B13E2E]">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v5"></path>
        <path d="M12 16h.01"></path>
      </svg>
    </div>

    <!-- Judul dan deskripsi -->
    <h1
      id="hapus-rencana-title"
      class="mt-3 text-[16px] font-bold leading-5 text-[#202923]"
    >
      Hapus rencana?
    </h1>

    <p class="mt-1.5 text-[12px] leading-[17px] text-[#667069]">
      Rencana ini hilang dari daftar. Hasil pemeriksaan dan lahannya
      tidak ikut terhapus.
    </p>

    <!-- Tombol aksi -->
    <div class="mt-4 flex justify-end gap-2">
      <a
        href="{% url 'recommendations:detail_rencana' rencana.pk %}"
        class="inline-flex min-h-[30px] items-center justify-center rounded-full border border-[#E8E2D8] px-[14px] text-[11px] font-semibold text-[#303831] transition hover:bg-[#F7F5F0]"
      >
        Batal
      </a>

      <form method="post" class="inline-flex">
        {% csrf_token %}
        <button
          type="submit"
          class="inline-flex min-h-[30px] items-center justify-center rounded-full bg-[#B13E2E] px-[15px] text-[11px] font-semibold text-white transition hover:bg-[#963225]"
        >
          Hapus rencana
        </button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
