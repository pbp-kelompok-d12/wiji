<div class="field">
  <label for="{{ field.id_for_label }}" class="field-label">
    {{ field.label }}{% if field.field.required %}<span class="ml-0.5 text-brick">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field-hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
