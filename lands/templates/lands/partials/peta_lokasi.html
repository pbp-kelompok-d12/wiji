{% load static l10n %}
<div class="d-card overflow-hidden"
     data-peta-lokasi
     data-cari-url="{% url 'lands:cari_lokasi' %}"
     data-reverse-url="{% url 'lands:reverse_lokasi' %}"
     data-lat="{{ form.latitude.value|default_if_none:''|unlocalize }}"
     data-lng="{{ form.longitude.value|default_if_none:''|unlocalize }}">
  <div class="border-b border-line p-4">
    <label for="lokasi-search" class="field-label">Cari lokasi di peta</label>
    <div class="mt-2 flex gap-2">
      <div class="relative min-w-0 flex-1">
        <svg class="ic ic-sm pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink-soft"><use href="#i-search"/></svg>
        <input id="lokasi-search" type="search" autocomplete="off"
               class="field-input !h-11 !pl-9"
               placeholder="Contoh: Dramaga, Bogor"
               aria-describedby="lokasi-status">
      </div>
      <button type="button" id="lokasi-search-btn" class="btn btn-leaf !min-h-11 shrink-0" aria-label="Cari alamat">
        Cari
      </button>
    </div>
    <div id="lokasi-results" class="mt-2 hidden overflow-hidden rounded-xl border border-line"></div>
    <p id="lokasi-status" class="mt-2 text-xs text-ink-soft" aria-live="polite">Klik peta atau geser penanda untuk memilih titik lahan.</p>
  </div>

  <div id="peta-lahan" class="h-[320px] w-full bg-paper sm:h-[380px]" role="application" aria-label="Peta pemilihan lokasi lahan"></div>

  <div class="flex flex-wrap items-center justify-between gap-3 border-t border-line p-4">
    <p class="max-w-xs text-[11px] leading-4 text-ink-soft">Alamat akan diisi otomatis dari titik yang dipilih. Kamu tetap bisa mengubahnya.</p>
    <button type="button" id="pakai-lokasi" class="btn btn-outline !min-h-9 gap-2 text-xs">
      <svg class="ic ic-sm"><use href="#i-pin"/></svg>Gunakan lokasi saya
    </button>
  </div>
</div>
